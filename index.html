<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Service Delivery Executive Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
:root{
  --bg:#f4f6f9;
  --card:#ffffff;
  --text:#0f172a;
  --muted:#64748b;
  --accent:#1e40af;
  --border:#e2e8f0;
}
.dark{
  --bg:#0f172a;
  --card:#1e293b;
  --text:#f1f5f9;
  --muted:#94a3b8;
  --accent:#3b82f6;
  --border:#334155;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  background:var(--bg);
  color:var(--text);
  transition:.3s;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:40px 20px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 0;
}

button{
  padding:8px 14px;
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--card);
  cursor:pointer;
  color:var(--text);
}

.kpis{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  margin:40px 0;
}

.card{
  background:var(--card);
  padding:25px;
  border-radius:12px;
  border:1px solid var(--border);
}

.chart-box{
  margin-top:40px;
}

.admin{
  margin-top:60px;
  padding:20px;
  border:1px dashed var(--border);
}

input{
  padding:6px;
  margin:5px;
}

</style>
</head>
<body>

<div class="container">

<header>
  <h2>Executive SLA Performance Dashboard</h2>
  <div>
    <button onclick="toggleTheme()">Toggle Theme</button>
    <button onclick="generatePDF()">Download Report</button>
  </div>
</header>

<div class="kpis">
  <div class="card">
    <h3>Total Tickets</h3>
    <h1 id="totalTickets">120</h1>
  </div>
  <div class="card">
    <h3>SLA Compliance</h3>
    <h1 id="slaValue">96%</h1>
  </div>
  <div class="card">
    <h3>Avg Resolution (hrs)</h3>
    <h1 id="avgRes">1.4</h1>
  </div>
</div>

<div class="chart-box card">
  <h3>SLA Trend (Last 6 Months)</h3>
  <canvas id="slaChart"></canvas>
</div>

<div class="admin">
  <h3>Admin Panel (Edit KPIs)</h3>
  <input id="editTickets" placeholder="Total Tickets">
  <input id="editSLA" placeholder="SLA %">
  <input id="editAvg" placeholder="Avg Resolution">
  <button onclick="updateKPIs()">Update</button>
</div>

</div>

<script>
// THEME TOGGLE
function toggleTheme(){
  document.body.classList.toggle("dark");
  localStorage.setItem("theme",document.body.classList.contains("dark"));
}
if(localStorage.getItem("theme")==="true"){
  document.body.classList.add("dark");
}

// KPI UPDATE
function updateKPIs(){
  document.getElementById("totalTickets").innerText =
    document.getElementById("editTickets").value;
  document.getElementById("slaValue").innerText =
    document.getElementById("editSLA").value + "%";
  document.getElementById("avgRes").innerText =
    document.getElementById("editAvg").value;
}

// CHART
const ctx=document.getElementById("slaChart").getContext("2d");
new Chart(ctx,{
  type:'line',
  data:{
    labels:["Jan","Feb","Mar","Apr","May","Jun"],
    datasets:[{
      label:"SLA %",
      data:[92,94,95,93,97,96],
      borderWidth:3,
      tension:.4
    }]
  },
  options:{
    responsive:true,
    plugins:{legend:{display:false}},
    scales:{y:{min:80,max:100}}
  }
});

// PDF EXPORT
async function generatePDF(){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF();
  doc.text("Executive SLA Performance Report",20,20);
  doc.text("Total Tickets: "+document.getElementById("totalTickets").innerText,20,40);
  doc.text("SLA Compliance: "+document.getElementById("slaValue").innerText,20,50);
  doc.text("Avg Resolution: "+document.getElementById("avgRes").innerText+" hrs",20,60);
  doc.save("SLA_Report.pdf");
}
</script>

</body>
</html>
