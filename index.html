<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lunga Mzimkulu | Service Operations</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root {
    --bg: #0f172a;
    --card: #1e293b;
    --text: #e2e8f0;
    --accent: #3b82f6;
}

.light {
    --bg: #f1f5f9;
    --card: #ffffff;
    --text: #0f172a;
    --accent: #2563eb;
}

body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: 0.3s;
}

header {
    padding: 40px;
    text-align: center;
}

h1 {
    font-size: 32px;
    margin-bottom: 10px;
}

button {
    padding: 8px 16px;
    background: var(--accent);
    border: none;
    color: white;
    border-radius: 6px;
    cursor: pointer;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
    gap: 20px;
}

.card {
    background: var(--card);
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

.card h3 {
    margin-top: 0;
    font-size: 16px;
    opacity: 0.8;
}

.metric {
    font-size: 32px;
    font-weight: bold;
}

footer {
    text-align: center;
    padding: 30px;
    opacity: 0.6;
}

canvas {
    margin-top: 20px;
}
</style>
</head>

<body>

<header>
    <h1>Lunga Mzimkulu</h1>
    <p>Service Operations | Incident Management | SLA Governance</p>
    <button onclick="toggleTheme()">Toggle Dark / Light</button>
</header>

<div class="container">

    <!-- KPI SECTION -->
    <div class="grid">
        <div class="card">
            <h3>Total Tickets</h3>
            <div class="metric">4</div>
        </div>

        <div class="card">
            <h3>Closed Tickets</h3>
            <div class="metric">4</div>
        </div>

        <div class="card">
            <h3>SLA Compliance</h3>
            <div class="metric">100%</div>
        </div>

        <div class="card">
            <h3>Avg Resolution Time</h3>
            <div class="metric">1.07 hrs</div>
        </div>
    </div>

    <!-- SLA GAUGE -->
    <div class="card">
        <h3>SLA Performance</h3>
        <canvas id="slaGauge"></canvas>
    </div>

    <!-- SLA TREND -->
    <div class="card">
        <h3>Resolution Time Trend</h3>
        <canvas id="trendChart"></canvas>
    </div>

</div>

<footer>
    © 2026 Lunga Mzimkulu | Enterprise Service Operations Portfolio
</footer>

<script>
// Dark / Light Toggle
function toggleTheme() {
    document.body.classList.toggle("light");
}

// SLA Gauge
new Chart(document.getElementById('slaGauge'), {
    type: 'doughnut',
    data: {
        labels: ['SLA Met', 'Remaining'],
        datasets: [{
            data: [100, 0],
            backgroundColor: ['#22c55e','#334155']
        }]
    },
    options: {
        cutout: '75%',
        plugins: {
            legend: { display: false }
        }
    }
});

// Trend Chart
new Chart(document.getElementById('trendChart'), {
    type: 'line',
    data: {
        labels: ['Ticket 1','Ticket 2','Ticket 3','Ticket 4'],
        datasets: [{
            label: 'Resolution Hours',
            data: [0.52,1.21,1.08,1.46],
            borderColor: '#3b82f6',
            tension: 0.4,
            fill: false
        }]
    },
    options: {
        responsive: true,
        plugins: {
            legend: { display: true }
        }
    }
});
</script>

</body>
</html>
